<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1160" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="19" font-weight="bold" fill="#0f172a">Node.js Asynchronous Syslog Collector, Burst Correlator &amp; Real-Time SSE Pipeline</text>
  <text x="40" y="60" font-size="12.5" fill="#475569">RFC 3164 &amp; RFC 5424 UDP Ingestion (dgram)  |  Bitwise PRI Decoder  |  Append-Only NDJSON &amp; HTTP Stream</text>

  <!-- Left: Log Producers -->
  <rect x="40" y="95" width="285" height="190" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="123" font-size="13.5" font-weight="bold" fill="#1e3a8a">Network &amp; Linux Log Sources</text>
  <text x="56" y="150" font-size="12" fill="#1e293b">• Linux Hosts (logger / rsyslog)</text>
  <text x="56" y="175" font-size="12" fill="#1e293b">• Stateful Firewall (nftables drops)</text>
  <text x="56" y="200" font-size="12" fill="#1e293b">• Switches &amp; Routers (Link/BGP traps)</text>
  <text x="56" y="225" font-size="12" fill="#1e293b">• Formats: RFC 3164 &amp; RFC 5424</text>
  <text x="56" y="253" font-size="12" font-weight="bold" fill="#1d4ed8">• Transport: Non-Blocking UDP/5514</text>

  <rect x="40" y="330" width="285" height="185" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="56" y="358" font-size="13.5" font-weight="bold" fill="#9a3412">Wire Datagram Structure</text>
  <text x="56" y="385" font-size="12" fill="#1e293b">• Header: &lt;PRI&gt; = Facility*8 + Sev</text>
  <text x="56" y="410" font-size="12" fill="#1e293b">• Severity 0..3: Emerg..Error</text>
  <text x="56" y="435" font-size="12" fill="#1e293b">• Severity 4..7: Warn..Debug</text>
  <text x="56" y="460" font-size="12" fill="#1e293b">• Metadata: Timestamp, Host, App</text>
  <text x="56" y="485" font-size="12" font-weight="bold" fill="#c2410c">• Zero External NPM Dependencies</text>

  <!-- Center: Node.js Event Loop Engine -->
  <rect x="415" y="85" width="330" height="475" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="435" y="112" font-size="13.5" font-weight="bold" fill="#0f172a">Node.js v18+ Engine (ES Modules)</text>

  <rect x="435" y="130" width="290" height="115" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.8"/>
  <text x="450" y="155" font-size="13" font-weight="bold" fill="#581c87">1. UDP Socket &amp; RFC Parser</text>
  <text x="450" y="179" font-size="12" fill="#1e293b">• node:dgram UDP4 Socket Listener</text>
  <text x="450" y="201" font-size="12" fill="#1e293b">• Bitwise PRI (PRI &gt;&gt; 3, PRI &amp; 7)</text>
  <text x="450" y="223" font-size="12" fill="#1e293b">• Host, AppName, PID &amp; Msg Parse</text>

  <line x1="580" y1="245" x2="580" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="435" y="282" width="290" height="115" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="450" y="307" font-size="13" font-weight="bold" fill="#854d0e">2. Sliding-Window Burst Detector</text>
  <text x="450" y="331" font-size="12" fill="#1e293b">• Tracks High-Severity Events / Host</text>
  <text x="450" y="353" font-size="12" fill="#1e293b">• Threshold (&gt;= 5 Hits / 60s Window)</text>
  <text x="450" y="375" font-size="12" font-weight="bold" fill="#92400e">• Emits BURST_ALERT Correlation</text>

  <line x1="580" y1="397" x2="580" y2="428" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="435" y="432" width="290" height="108" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="457" font-size="13" font-weight="bold" fill="#14532d">3. Ring Buffer &amp; Async Broadcaster</text>
  <text x="450" y="481" font-size="12" fill="#1e293b">• Bounded In-Memory Ring Buffer</text>
  <text x="450" y="503" font-size="12" fill="#1e293b">• Fan-out Push to Active SSE Clients</text>
  <text x="450" y="523" font-size="12" fill="#1e293b">• Graceful SIGINT/SIGTERM Drain</text>

  <!-- Right: Persistence & Consumers -->
  <rect x="830" y="100" width="290" height="185" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="846" y="128" font-size="13.5" font-weight="bold" fill="#991b1b">Append-Only Storage (node:fs)</text>
  <text x="846" y="154" font-size="12" fill="#1e293b">• File: logs/syslog-events.ndjson</text>
  <text x="846" y="178" font-size="12" fill="#1e293b">• Format: Newline-Delimited JSON</text>
  <text x="846" y="202" font-size="12" fill="#1e293b">• Non-Blocking Write Stream</text>
  <text x="846" y="226" font-size="12" font-weight="bold" fill="#b91c1c">• Ready for SIEM / SQL Ingestion</text>

  <rect x="830" y="340" width="290" height="205" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="846" y="368" font-size="13.5" font-weight="bold" fill="#0c4a6e">HTTP REST &amp; Live SSE (Port 8080)</text>
  <text x="846" y="395" font-size="12" fill="#1e293b">• GET /health (Metrics &amp; Counters)</text>
  <text x="846" y="420" font-size="12" fill="#1e293b">• GET /api/events?severity_max=3</text>
  <text x="846" y="445" font-size="12" fill="#1e293b">• GET /api/alerts (Correlated Bursts)</text>
  <text x="846" y="470" font-size="12" fill="#1e293b">• GET /api/stream (Live text/event-stream)</text>
  <text x="846" y="498" font-size="12" font-weight="bold" fill="#0369a1">• Tested via node --test Suite</text>

  <!-- Connectors -->
  <line x1="325" y1="185" x2="432" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="342" y="176" font-size="11" font-weight="bold" fill="#1d4ed8">UDP/5514</text>

  <path d="M 725 470 L 780 470 L 780 190 L 827 190" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="738" y="182" font-size="11" font-weight="bold" fill="#b91c1c">NDJSON</text>

  <line x1="725" y1="495" x2="827" y2="495" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="745" y="485" font-size="11" font-weight="bold" fill="#0369a1">SSE / JSON</text>
</svg>